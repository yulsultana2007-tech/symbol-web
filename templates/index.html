<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symbol Web</title>
</head>
<body>

    <main class="container">

        <header class="header">
            <h1>Symbol Web</h1>
            <p>Create your own ASCII art</p>
        </header>

        <section class="generator">

            <h2>ASCII Art Generator</h2>

            <form action="/symbol-art" method="POST">

                <label for="text-input">Enter your text</label>

                <input
                    type="text"
                    id="text-input"
                    name="text"
                    placeholder="Type something..."
                    required
                >

                <h3>Choose Banner</h3>

                <div class="banner-options">

                    <label>
                        <input type="radio" name="banner" value="standard" checked>
                        Standard
                    </label>

                    <label>
                        <input type="radio" name="banner" value="shadow">
                        Shadow
                    </label>

                    <label>
                        <input type="radio" name="banner" value="thinkertoy">
                        Thinkertoy
                    </label>

                </div>

                <button type="submit">Generate Art</button>

            </form>

        </section>

        <section class="result-section">

            <h2>Your Result</h2>

            <div class="result-box">
                <pre id="art-result"></pre>
            </div>

        </section>

    </main>

</body>
</html>
